<!-- templates/students_logs.html -->
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ app_name }} のログ - 受講者ダッシュボード</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 14px;
      line-height: 1.6;
      background: #f8fafc;
      color: #1e293b;
    }

    a { color: #2563eb; }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 22px rgba(2, 6, 23, .06);
      margin-bottom: 16px;
    }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .badge.active { background: #dcfce7; color: #166534; }
    .badge.other  { background: #fee2e2; color: #991b1b; }

    pre {
      white-space: pre-wrap;
      word-break: break-all;
      overflow-y: auto;
      border-radius: 10px;
      padding: 14px;
      font-size: 13px;
    }

    pre.error  { background: #1e1e1e; color: #e2e8f0; max-height: 480px; }
    pre.access { background: #f1f5f9; color: #334155; max-height: 220px; }

    .muted { color: #64748b; font-size: 13px; }
  </style>
</head>

<body>
  <p><a href="{{ url_prefix }}/">&laquo; ダッシュボードに戻る</a></p>

  <div class="card">
    <h2 style="margin-top:0;">{{ app_name }} のログ</h2>
    <p>
      現在の状態:
      {% if service_state == "active" %}
      <span class="badge active">稼働中 (active)</span>
      {% else %}
      <span class="badge other">{{ service_state }}</span>
      {% endif %}
      　<a href="{{ url_prefix }}/logs/{{ request_id }}">🔄 更新</a>
    </p>
    <p class="muted">
      「公開中」なのにこのページで稼働中と表示されない場合は、下の error.log の末尾に
      直近のエラー（Traceback）が出ていないか確認してください。
    </p>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">error.log（末尾）</h3>
    <pre class="error">{{ error_log }}</pre>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">access.log（末尾）</h3>
    <pre class="access">{{ access_log }}</pre>
  </div>
</body>

</html>
