<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>受講者ログイン</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 860px; margin: 20px auto; padding: 0 14px; line-height: 1.6; background:#f8fafc;}
    .card { background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:18px; box-shadow: 0 8px 22px rgba(2,6,23,.06); }
    h1 { font-size: 1.4rem; margin: 0 0 10px; }
    label { display:block; margin-top:12px; font-weight:700; }
    input { width:100%; padding:12px; border:1px solid #d1d5db; border-radius:12px; margin-top:6px; font-size: 1rem; }
    button { margin-top:14px; padding:12px 16px; border:0; border-radius:12px; font-weight:800; cursor:pointer; background:#4f46e5; color:#fff; }
    .flash { margin-top: 14px; padding: 12px; border-radius: 12px; white-space: pre-wrap; }
    .ok { background:#ecfdf5; border:1px solid #10b981; }
    .err { background:#fef2f2; border:1px solid #ef4444; }
    .help { color:#475569; font-size:.95rem; margin-top:10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>受講者ログイン</h1>
    <div class="help">受講者番号でログインすると、自分の申請一覧が常に表示されます。</div>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% if msgs %}
        {% for cat, msg in msgs %}
          <div class="flash {{cat}}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('students_login_post') }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label>受講者番号（6桁）</label>
      <input type="text" name="student_id" placeholder="例: 250101" inputmode="numeric" required>

      {% if require_pin %}
      <label>PIN</label>
      <input type="password" name="pin" placeholder="PIN を入力" required>
      {% endif %}

      <button type="submit">ログイン</button>
    </form>
  </div>
</body>
</html>
