<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>講師 - NextCloud リセット</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f8fafc; margin: 18px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 24px;
            box-shadow: 0 8px 22px rgba(2,6,23,.06); max-width: 560px; margin: 40px auto; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 1.2rem; }
    .btn { padding: 10px 14px; border: 0; border-radius: 12px; font-weight: 800; cursor: pointer;
           text-decoration: none; display: inline-block; font-size: .95rem; }
    .secondary { background: #fff; border: 1px solid #cbd5e1; color: #334155; }
    .danger { background: #ef4444; color: #fff; }
    .flash { margin: 10px 0; padding: 10px; border-radius: 12px;
             background: #ecfdf5; border: 1px solid #10b981; white-space: pre-wrap; }
    .flash.err { background: #fef2f2; border-color: #ef4444; }
    .warn-box { background: #fffbeb; border: 1px solid #f59e0b; border-radius: 14px;
                padding: 18px 20px; margin: 16px 0; }
    .warn-box p { margin: 0 0 10px; font-size: .95rem; color: #92400e; }
    .warn-box ul { margin: 0; padding-left: 1.4em; font-size: .9rem; color: #78350f; }
    label { display: block; font-weight: 700; font-size: .9rem; margin-bottom: 6px; }
    input[type=text], input[type=password] {
      padding: 10px; border: 1px solid #d1d5db; border-radius: 12px;
      background: #fff; width: 100%; box-sizing: border-box; font-size: .95rem; margin-bottom: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header-row">
      <h1>☁️ NextCloud リセット</h1>
      <a class="btn secondary" href="{{ url_for('teacher_menu') }}">← メニューへ</a>
    </div>

    {% with msgs = get_flashed_messages(with_categories=true) %}
    {% if msgs %}{% for cat, msg in msgs %}
    <div class="flash {{ 'err' if cat=='err' else '' }}">{{ msg }}</div>
    {% endfor %}{% endif %}
    {% endwith %}

    <div class="warn-box">
      <p>⚠️ この操作は取り消せません。実行前に確認してください。</p>
      <ul>
        <li>全ユーザーの保存ファイルをすべて削除します</li>
        <li>アカウント（ユーザー名・パスワード）は残ります</li>
        <li>admin アカウントは対象外です</li>
      </ul>
    </div>

    <form method="post" action="{{ url_for('reset_nextcloud_post') }}"
          onsubmit="return confirm('NextCloud の全ユーザーファイルを削除します。本当によいですか？')">
      <label for="reset_key">Reset Key</label>
      <input type="password" id="reset_key" name="reset_key" placeholder="Reset Key を入力" required autocomplete="off">
      <button class="btn danger" type="submit">🗑 全ユーザーファイルを削除して初期化</button>
    </form>
  </div>
</body>
</html>
