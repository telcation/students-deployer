<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>講師 - アカウント一覧管理</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f8fafc;
      margin: 18px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 22px rgba(2, 6, 23, .06);
      max-width: 560px;
      margin: 40px auto;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
    }

    .btn {
      padding: 10px 14px;
      border: 0;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      font-size: .95rem;
    }

    .primary {
      background: #4f46e5;
      color: #fff;
    }

    .secondary {
      background: #fff;
      border: 1px solid #cbd5e1;
      color: #334155;
    }

    .flash {
      margin: 10px 0;
      padding: 10px;
      border-radius: 12px;
      background: #ecfdf5;
      border: 1px solid #10b981;
      white-space: pre-wrap;
    }

    .flash.err {
      background: #fef2f2;
      border-color: #ef4444;
    }

    .upload-box {
      margin-top: 16px;
      padding: 20px;
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 14px;
    }

    .upload-box label {
      display: block;
      font-weight: 700;
      font-size: .9rem;
      color: #166534;
      margin-bottom: 10px;
    }

    .upload-box input[type=file] {
      display: block;
      font-size: .9rem;
      border: 1px solid #86efac;
      background: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 14px;
      width: 100%;
      box-sizing: border-box;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .help {
      font-size: .85rem;
      color: #64748b;
      margin-top: 14px;
    }

    /* ドラッグ＆ドロップエリア */
    .drop-zone {
      border: 2px dashed #86efac;
      border-radius: 14px;
      background: #f0fdf4;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: background .2s, border-color .2s;
      position: relative;
    }
    .drop-zone.drag-over {
      background: #dcfce7;
      border-color: #22c55e;
    }
    .drop-zone .drop-icon {
      font-size: 2rem;
      display: block;
      margin-bottom: 8px;
    }
    .drop-zone .drop-label {
      font-weight: 700;
      font-size: .95rem;
      color: #166534;
    }
    .drop-zone .drop-sub {
      font-size: .82rem;
      color: #4ade80;
      margin-top: 4px;
    }
    .drop-zone input[type=file] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .file-selected {
      margin-top: 10px;
      font-size: .88rem;
      color: #15803d;
      font-weight: 700;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header-row">
      <h1>📊 アカウント一覧管理</h1>
      <a class="btn secondary" href="{{ url_for('teacher_menu') }}">← メニューへ</a>
    </div>

    {% with msgs = get_flashed_messages(with_categories=true) %}
    {% if msgs %}
    {% for cat, msg in msgs %}
    <div class="flash {{ 'err' if cat=='err' else '' }}">{{ msg }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <div class="upload-box">
      <label>アカウント一覧 xlsx をアップロード</label>
      <form id="uploadForm" method="post"
            action="{{ url_for('teacher_upload_accounts') }}"
            enctype="multipart/form-data">
        <input type="hidden" name="return_to" value="{{ url_for('teacher_accounts_manage') }}">

        <!-- ドラッグ＆ドロップ + クリック選択エリア -->
        <div class="drop-zone" id="dropZone">
          <input type="file" name="accounts_file" accept=".xlsx" id="fileInput" required>
          <span class="drop-icon">📂</span>
          <span class="drop-label">ここにファイルをドロップ</span>
          <div class="drop-sub">または クリックして選択</div>
        </div>
        <div class="file-selected" id="fileSelected"></div>

        <div class="btn-row" style="margin-top:14px">
          <button class="btn primary" type="submit">アップロード</button>
          <a class="btn secondary" href="{{ url_for('accounts_view') }}" target="_blank">
            👁 現在のファイルを閲覧
          </a>
        </div>
      </form>
    </div>

    <p class="help">.xlsx 形式のみアップロードできます。アップロードすると既存ファイルは上書きされます。</p>
  </div>

  <script>
    const dropZone   = document.getElementById('dropZone');
    const fileInput  = document.getElementById('fileInput');
    const fileLabel  = document.getElementById('fileSelected');

    function showFileName(file) {
      fileLabel.textContent = file ? `✅ ${file.name}` : '';
    }

    // クリック選択後の表示
    fileInput.addEventListener('change', () => {
      showFileName(fileInput.files[0]);
    });

    // ドラッグ中のハイライト
    ['dragenter', 'dragover'].forEach(ev => {
      dropZone.addEventListener(ev, e => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
      });
    });
    ['dragleave', 'drop'].forEach(ev => {
      dropZone.addEventListener(ev, () => dropZone.classList.remove('drag-over'));
    });

    // ドロップ処理
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (!file) return;
      if (!file.name.toLowerCase().endsWith('.xlsx')) {
        alert('.xlsx ファイルのみアップロードできます');
        return;
      }
      // DataTransfer を input に反映
      const dt = new DataTransfer();
      dt.items.add(file);
      fileInput.files = dt.files;
      showFileName(file);
    });
  </script>
</body>
</html>
